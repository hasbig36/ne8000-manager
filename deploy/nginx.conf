# nginx in front of NE8000 Manager. Put in /etc/nginx/sites-available/ne8000 and enable it.
# Get a certificate first, for example:  certbot --nginx -d ne8000.example.com
server {
    listen 80;
    server_name ne8000.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ne8000.example.com;

    ssl_certificate     /etc/letsencrypt/live/ne8000.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ne8000.example.com/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;   # long router commands (full config, traceroute)
    }
}
